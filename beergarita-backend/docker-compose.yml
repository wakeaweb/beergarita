version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beergarita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beergaritapass}
      POSTGRES_DB: ${POSTGRES_DB:-beergarita}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beergarita} -d ${POSTGRES_DB:-beergarita}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beergarita}:${POSTGRES_PASSWORD:-beergaritapass}@db:5432/${POSTGRES_DB:-beergarita}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT_EXTERNAL:-3001}:${PORT_INTERNAL:-3000}"
    volumes:
      - uploads:/app/uploads

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8083:8080"
    depends_on:
      - db

volumes:
  postgres_data:
  uploads:
