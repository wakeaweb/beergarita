services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tradeops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradeops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tradeops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tradeops}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - uploads:/app/uploads

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "3002:80"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8083:8080"
    depends_on:
      - db

volumes:
  postgres_data:
  uploads:
