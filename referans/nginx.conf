events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name tradeops.kairosglobal.nl;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name tradeops.kairosglobal.nl;

        ssl_certificate     /etc/letsencrypt/live/tradeops.kairosglobal.nl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tradeops.kairosglobal.nl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # API → backend server container
        location /api/v1/ {
            proxy_pass http://server:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # File uploads → backend server container
        location /uploads/ {
            proxy_pass http://server:3000;
            proxy_set_header Host $host;
        }

        # React SPA → client container
        location / {
            proxy_pass http://client:80;
            proxy_set_header Host $host;
        }
    }
}
